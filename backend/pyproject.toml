[project]
name = "assistant"
version = "0.1.0"
description = "Personal AI project assistant - orchestration layer over Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LangChain ecosystem (1.0 LTS)
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "deepagents",
    "langsmith>=0.3.0",
    "langchain-ollama",
    "langchain-qdrant",
    "langchain-text-splitters",
    "langgraph-checkpoint-postgres",
    # Claude Code bridge
    "claude-agent-sdk",
    # API
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "httpx",
    # Persistence
    "sqlalchemy[asyncio]>=2.0",
    "alembic",
    "psycopg[binary,pool]",
    "qdrant-client",
    # Jobs
    "procrastinate[psycopg]",
    "apscheduler>=3.10",
    "watchfiles",
    # CLI + config
    "typer",
    "rich",
    "pydantic-settings",
    "fastembed>=0.8.0",
]

[project.scripts]
assistant = "assistant.cli.main:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "import-linter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PGH", "ANN", "C4", "RUF", "ASYNC"]
ignore = [
    "ANN401",  # explicit Any in annotations -- banned, but mypy disallow_any_explicit
               # reports it with better context; keep a single source of truth
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]  # test fns don't need return annotations; fixtures stay readable

[tool.ruff.lint.isort]
known-first-party = ["assistant"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["assistant"]

[[tool.mypy.overrides]]
module = ["deepagents.*", "procrastinate.*", "fastembed.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests: strict minus explicit-Any ban (fixtures/parametrize interop needs it).
module = ["tests.*"]
disallow_any_explicit = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.importlinter]
root_package = "assistant"
include_external_packages = true

# Layer boundary contracts (RULES_AND_GUIDELINES §7), adapted to this project's
# 3-layer + shared-kernel layout (no framework-independent domain layer exists).
# Uses import-linter's `layers` contract: higher layers may depend on lower layers,
# never the reverse. Order is high -> low.
#   interface -> application -> infrastructure -> shared
# The interface layer reaches infrastructure only through the application
# services, which are the documented seam.

[[tool.importlinter.contracts]]
name = "layered architecture"
type = "layers"
containers = [
    "assistant",
]
layers = [
    "interface",
    "application",
    "infrastructure",
    "shared",
]
