name: Deploy to krisiserver

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # manual re-deploy from the Actions tab

# Never run two deploys at once; a push during a deploy queues (not cancels)
# so the newest commit still lands last.
concurrency:
  group: deploy-krisiserver
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: krisiserver
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.KRISISERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Host key pinned (public info) - no TOFU against a fresh runner
          echo "194.182.86.101 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINfhTLkzrU1RYka6A5waaIpqITDbmirtImMcNIaH6PQW" >> ~/.ssh/known_hosts

      - name: Pull and rebuild stack
        run: |
          ssh deploy@194.182.86.101 'set -e
            # Build context: pristine checkout used by `docker compose --build`.
            # CC must never edit here or it dirties the image build.
            cd /home/deploy/bitch-stewie
            git fetch origin
            git reset --hard origin/main

            # Self-rewrite target: a SEPARATE checkout that CC edits, snapped to
            # latest main on every deploy. Mounted into the containers at
            # /projects/bitch-stewie. In the serial human-gated loop a deploy only
            # fires after a merge, so the session is already finished and this
            # reset is safe. `checkout -B main origin/main` lands on main whatever
            # branch CC left checked out; `clean -fd` drops stray untracked files.
            if [ ! -d /home/deploy/projects/bitch-stewie/.git ]; then
              git clone https://github.com/Kr1si/bitch-stewie.git /home/deploy/projects/bitch-stewie
            fi
            # The worker container runs CC sessions as root, so files it writes
            # into this bind mount are root-owned on the host and deploy cannot
            # git-clean them - reclaim ownership first or the reset silently
            # aborts the whole deploy under set -e.
            sudo chown -R deploy:deploy /home/deploy/projects/bitch-stewie
            cd /home/deploy/projects/bitch-stewie
            git fetch origin
            git checkout -B main origin/main
            git clean -fd

            cd /home/deploy/bitch-stewie/docker
            sudo docker compose -f docker-compose.prod.yml up -d --build
            sudo docker image prune -f
            # No separate assistant seed step here: the backend containers
            # own CMD already runs it (idempotent) on every start, including
            # this recreate. A redundant second exec here OOM-killed deploys
            # (exit 137) by piling onto the highest memory-pressure moment
            # right after a 3-image rebuild.'

      - name: Verify
        run: |
          ssh deploy@194.182.86.101 '
            cd /home/deploy/bitch-stewie/docker

            # Wait for containers to report healthy BEFORE polling the API. The
            # rebuild step recreates containers; polling port 3000 during that
            # window races nginx binding and gets connection-refused until the step
            # gives up. The frontend healthcheck (curl http://localhost/) only
            # passes once nginx is actually listening, so waiting here makes the
            # subsequent API poll reliable. 30 attempts x 10s = 5min grace period.
            for i in $(seq 1 30); do
              status=$(sudo docker inspect --format="{{.State.Health.Status}}" assistant-prod-frontend-1 2>/dev/null || echo "unknown")
              if [ "$status" = "healthy" ]; then echo "frontend: healthy (after ${i}0s)"; break; fi
              if [ "$status" = "unknown" ]; then echo "frontend: no healthcheck yet (container recreating)"; fi
              sleep 10
            done

            # backend runs alembic migrations before starting uvicorn (~25s on
            # a fresh boot), so poll until the API actually responds 200. The
            # healthy-frontend wait above already absorbed the container-recreate
            # window, so this poll starts from a stable base.
            # --max-time bounds each probe so a hung backend can't stall the step
            # past the job timeout; 30 attempts x (15s timeout + 10s sleep) ≈ 12min max.
            elapsed=0
            for i in $(seq 1 30); do
              code=$(curl -sS --max-time 15 -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/projects || echo 000)
              if [ "$code" = "200" ]; then echo "API through nginx: HTTP $code (after ${elapsed}s)"; exit 0; fi
              sleep 10
              elapsed=$((elapsed + 25))
            done
            echo "API through nginx: HTTP $code (never came up)"
            sudo docker compose -f docker-compose.prod.yml ps
            sudo docker logs --tail 20 assistant-prod-backend-1
            exit 1'
